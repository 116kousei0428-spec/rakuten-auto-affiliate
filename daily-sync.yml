name: Daily Rakuten product sync
on:
  workflow_dispatch:
  schedule:
    - cron: '23 18 * * *' # 03:23 JST, best-effort; GitHub may delay runs
permissions:
  contents: read
concurrency:
  group: affiliate-daily-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      SYNC_JOB_SECRET: ${{ secrets.SYNC_JOB_SECRET }}
    steps:
      - name: Sync one category at a time
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PUBLIC_BASE_URL" || -z "$SYNC_JOB_SECRET" ]]; then
            echo 'Synchronization inactive: configure PUBLIC_BASE_URL and SYNC_JOB_SECRET.'
            exit 0
          fi
          if [[ "$PUBLIC_BASE_URL" != https://* ]]; then echo 'Invalid HTTPS site URL'; exit 1; fi
          for cat in gadgets appliances beauty fashion home pets food other; do
           for page in 1 2 3; do
            echo "Sync category: $cat / page $page"
            curl --fail-with-body --silent --show-error --max-time 60 \
              --retry 2 --retry-delay 10 --retry-all-errors \
              -X POST "${PUBLIC_BASE_URL%/}/api/internal/sync" \
              -H "Authorization: Bearer $SYNC_JOB_SECRET" \
              -H 'Content-Type: application/json' \
              --data "{\"category\":\"$cat\",\"page\":$page}"
            echo
            sleep 3
           done
          done
