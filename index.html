<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>楽天アフィリエイト管理｜準備版</title><link rel="stylesheet" href="/style.css"></head><body><main class="wrap"><header><div><small>RAKUTEN AFFILIATE / STARTER</small><h1>アフィリエイト運用管理</h1><p>Cloudflare Workers公開構成の確認用・準備版</p></div><span id="status" class="chip">接続確認中</span></header><section class="notice"><strong>本番運用前の確認</strong><p>楽天API・D1・SNS投稿・AI生成は未接続です。下の原稿はブラウザ内で作るテンプレートで、自動投稿や収益計測は行いません。</p></section><section class="cards"><article><span>公開サイト</span><h2 id="health">確認中</h2><p>Worker APIの疎通</p></article><article><span>楽天API</span><h2>未接続</h2><p>商品データを取得しません</p></article><article><span>投稿機能</span><h2>下書きのみ</h2><p>SNSへの送信なし</p></article></section><section class="panel"><h2>投稿原稿テンプレート</h2><div class="form"><label>商品名<input id="name" maxlength="120" placeholder="実際の商品名を入力"></label><label>実際のアフィリエイトURL<input id="url" type="url" placeholder="https://..." maxlength="2000"></label><label>特徴（確認済みの事実のみ）<textarea id="features" rows="3" maxlength="500" placeholder="性能や使用感など、確認できた情報"></textarea></label><label>媒体<select id="platform"><option>Threads</option><option>Instagram</option><option>note</option><option>TikTok</option></select></label></div><button id="make">下書きを作成</button><button id="copy" class="secondary" disabled>原稿をコピー</button><p id="message" role="status"></p><textarea id="output" rows="8" readonly placeholder="ここに下書きが表示されます"></textarea></section><footer>※広告投稿では、必要な広告表示・各媒体と楽天の規約確認を行ってください。</footer></main><script src="/app.js" defer></script></body></html>
