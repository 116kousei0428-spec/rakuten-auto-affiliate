<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>楽天商品検索｜アフィリエイト運用</title><link rel="stylesheet" href="/style.css"></head><body><main><header><h1>楽天商品検索</h1><p>楽天市場の商品を検索し、紹介用リンクを確認できます。</p></header><form id="search-form"><input id="keyword" name="keyword" placeholder="商品を検索（例：ワイヤレスイヤホン）" maxlength="100" required><button type="submit">検索</button></form><p id="status" role="status">API接続を確認中…</p><section id="results" class="grid"></section><footer>※商品情報・価格は楽天市場APIから取得。表示内容は取得時点の情報です。</footer></main><script type="module" src="/app.js"></script></body></html>
